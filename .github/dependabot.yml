version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm: the browser SDK, the website and the standalone editor's frontend. Versions
  # must be at least two weeks old before they are proposed.
  - package-ecosystem: npm
    directories:
      - /sdk
      - /website
      - /rulestone-editor/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
