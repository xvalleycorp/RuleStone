version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to the slf4j-api version that Camunda 7 ships (1.7.x); a 2.x binding
      # would not bind to it.
      - dependency-name: org.slf4j:slf4j-nop
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm: the browser SDK, the website and the standalone editor's frontend. Versions
  # must be at least two weeks old before they are proposed.
  - package-ecosystem: npm
    directories:
      - /sdk
      - /website
      - /rulestone-editor/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Vite 8 requires lightningcss, licensed MPL-2.0, which is outside the project's
      # licence allowlist (Apache-2.0, MIT, BSD, ISC). Stay on vite 7 until that changes.
      - dependency-name: vite
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
