# Checks the browser SDK (sdk/): npm license allowlist, type check, build and tests,
# including the conformance suite against fixtures written by the Java engine.
name: SDK

on:
  push:
    branches: [main]
    paths: ['sdk/**', 'examples/**', 'docs/expressions.md', 'docs/fuzzy-matching.md',
            'rulestone-api/src/main/resources/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['sdk/**', 'examples/**', 'docs/expressions.md', 'docs/fuzzy-matching.md',
            'rulestone-api/src/main/resources/**', '.github/workflows/sdk.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: License allowlist
        run: npm run licenses
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Bundle size
        run: npm run size
